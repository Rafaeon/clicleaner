name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync
        run: uv sync --all-extras
      - name: Ruff
        run: uv run ruff check src
      - name: Ruff format
        run: uv run ruff format --check src
      - name: Pyright
        run: uv run pyright src
